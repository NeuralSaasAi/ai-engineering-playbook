[project]
name = "secure-rag"
version = "0.1.0"
description = "P2: a small RAG assistant, attacked and then defended against OWASP LLM risks"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["litellm==1.109.1"]

[project.scripts]
secure-rag = "secure_rag.cli:main"

[dependency-groups]
dev = ["pytest==9.2.0", "ruff==0.17.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
