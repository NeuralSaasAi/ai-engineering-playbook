[project]
name = "capstone"
version = "0.1.0"
description = "P5: the P4 support agent made production-ready: tracing, cost metrics, load testing, threat model and design doc"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "support-agent",
    "opentelemetry-api==1.45.2",
    "opentelemetry-sdk==1.45.2",
    "opentelemetry-exporter-otlp-proto-http==1.45.2",
    "httpx==0.28.1",
]

[project.scripts]
capstone-load = "capstone.loadtest:main"

[tool.uv.sources]
support-agent = { path = "../p4-guardrailed-support-agent", editable = true }

[dependency-groups]
dev = ["pytest==9.2.0", "ruff==0.17.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
