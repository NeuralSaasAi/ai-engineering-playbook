name: Checks

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly external link check, Mondays 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  content:
    name: Notes and markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Checker unit tests and runnable note snippets
        run: uv run --python 3.12 --with pytest --with langgraph==1.2.22 pytest -q scripts/tests
      - name: Note format, links, glossary, GFM-only syntax
        run: python3 scripts/check_notes.py
      - name: Markdown lint
        uses: DavidAnson/markdownlint-cli2-action@v20
        with:
          globs: "**/*.md"

  links:
    name: External links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore lychee cache
        uses: actions/cache@v4
        with:
          path: .lycheecache
          key: lychee-${{ github.sha }}
          restore-keys: lychee-
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --config lychee.toml --cache --max-cache-age 3d "./**/*.md"
          fail: true

  projects:
    name: Project ${{ matrix.project }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - p1-agent-built-cli
          - p2-secure-rag
          - p3-langgraph-research-agent
          - p4-guardrailed-support-agent
          - p5-production-capstone
    defaults:
      run:
        working-directory: projects/${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Test (fake LLM, no API keys)
        run: uv run pytest -q
